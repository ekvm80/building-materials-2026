// ============================================================
//  앱
// ============================================================
function FireFitApp() {
  const [tab, setTab] = useState("recommend");
  const [use, setUse] = useState("의료시설");
  const [floor, setFloor] = useState("11층 이상");
  const [part, setPart] = useState("거실 내벽");
  const [area, setArea] = useState("1,000㎡ 이상");
  const [sprinkler, setSprinkler] = useState("스프링클러 설치");
  const [areaSize, setAreaSize] = useState(1000);
  const [priority, setPriority] = useState("balance");
  const [aiResult, setAiResult] = useState(null);
  const [aiQuestion, setAiQuestion] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const [aiError, setAiError] = useState(null);
  const [copied, setCopied] = useState(false);
  const [apiKey, setApiKey] = useState("");

  // --- 법규 매칭 (5개 조건 반영) ---
  const rule = useMemo(() => {
    const base =
      RULES.find(
        (r) => (r.use === use || r.use === "전체") && (r.floor === floor || r.floor === "전체") && r.part === part
      ) || { lvl: 2, law: "건축법 제52조·시행령 제61조", revised: "특정 강화규정 없음", note: "기본 마감재 방화기준 준수 권고" };

    let lvl = base.lvl;
    const extras = [];
    if (area === "1,000㎡ 이상") {
      extras.push("연면적 1,000㎡ 이상 — 방화구획·마감재 규정 강화 대상");
      if (["거실 내벽", "대피공간", "외벽 마감재"].includes(part) && lvl < 3) lvl = 3;
    }
    if (sprinkler === "스프링클러 미설치") {
      extras.push("스프링클러 미설치 — 마감재(수동적) 방화성능 의존도 높음, 상위 등급 권장");
    } else {
      extras.push("스프링클러 설치 — 일부 방화구획 규정 완화 가능(마감재 법적 기준은 별도 충족)");
    }
    return { ...base, lvl, grade: GRADE_BY_LVL[lvl], extras };
  }, [use, floor, part, area, sprinkler]);

  const partMaterials = useMemo(() => MATERIALS.filter((m) => m.parts.includes(part)), [part]);
  const legalMaterials = useMemo(() => partMaterials.filter((m) => m.lvl >= rule.lvl), [partMaterials, rule]);

  // 비용 차이 콜아웃: 가장 싼 자재(미달 포함) vs 가장 싼 적법 자재
  const costDiff = useMemo(() => {
    if (partMaterials.length === 0 || legalMaterials.length === 0) return null;
    const cheapestAny = [...partMaterials].sort((a, b) => a.price - b.price)[0];
    const cheapestLegal = [...legalMaterials].sort((a, b) => a.price - b.price)[0];
    if (cheapestAny.lvl >= rule.lvl) return null; // 가장 싼 게 이미 적법이면 추가비용 없음
    const diff = (cheapestLegal.price - cheapestAny.price) * areaSize;
    return { cheapestAny, cheapestLegal, diff };
  }, [partMaterials, legalMaterials, rule, areaSize]);

  // --- 우선순위 추천 ---
  const pick = useMemo(() => {
    if (legalMaterials.length === 0) return null;
    const arr = [...legalMaterials];
    if (priority === "cost") return arr.sort((a, b) => a.price - b.price)[0];
    if (priority === "safety")
      return arr.sort((a, b) => b.lvl - a.lvl || (a.smoke === "낮음" ? -1 : 1) - (b.smoke === "낮음" ? -1 : 1) || a.price - b.price)[0];
    // 균형: 실무에서 대중적으로 쓰이는(popular) 자재 우선, 없으면 가성비
    const pop = arr.filter((m) => m.popular).sort((a, b) => a.price - b.price);
    return pop[0] || arr.sort((a, b) => b.lvl / b.price - a.lvl / a.price)[0];
  }, [legalMaterials, priority]);

  // --- 보고서 텍스트 (상시 노출용) ---
  const reportText = useMemo(() => {
    const m = legalMaterials[0];
    return `본 건축물은 연면적 ${area}의 ${use}로서, 건축법 제52조(건축물의 마감재료) 및 ${rule.law}에 의거하여 ${part}를 [${rule.grade} 재료 이상]으로 시공해야 함. 이에 따라 기준을 충족하는 자재(예: ${m ? m.name : "적합 자재"})를 검토함. [세부조건: ${floor}, ${sprinkler}]`;
  }, [use, floor, part, area, sprinkler, rule, legalMaterials]);

  const copyReport = async () => {
    let ok = false;
    try {
      await navigator.clipboard.writeText(reportText);
      ok = true;
    } catch {
      try {
        const ta = document.createElement("textarea");
        ta.value = reportText;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ok = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch { ok = false; }
    }
    setCopied(ok ? "done" : "fail");
    setTimeout(() => setCopied(false), 2000);
  };

  // --- AI (클릭형 템플릿 → 실제 Claude API) ---
  const TEMPLATES = [
    { emo: "💡", text: "층수가 높고 공사 예산이 매우 타이트한데, 가성비 좋은 준불연 자재 조합을 짜줘." },
    { emo: "🛡", text: "노약자가 이용하는 시설이라 법적 기준보다 안전을 더 강화하고 싶은데 어떤 자재가 좋을까?" },
    { emo: "⏱", text: "공사 기간이 촉박해서 시공 속도가 빠른 자재 위주로 장단점을 비교해줘." },
  ];

  const askAI = async (question) => {
    setAiQuestion(question);
    setAiError(null);
    setAiResult(null);

    // ── 데모 모드: API 키가 없으면 내장 자재 DB로 로컬 추천 (발표용) ──
    if (!apiKey) {
      setAiLoading(true);
      setTimeout(() => {
        const pool = legalMaterials.length ? legalMaterials : partMaterials;
        if (!pool.length) { setAiError("현재 조건에 맞는 자재 데이터가 없습니다."); setAiLoading(false); return; }
        let m;
        if (/안전|노약자|강화|위험/.test(question)) m = [...pool].sort((a, b) => b.lvl - a.lvl || a.price - b.price)[0];
        else if (/시공|기간|속도|빠른|촉박/.test(question)) m = [...pool].filter((x) => x.fast).sort((a, b) => a.price - b.price)[0] || pool[0];
        else m = [...pool].sort((a, b) => a.price - b.price)[0];
        setAiResult({
          recommended_material: m.name,
          safety_grade: m.grade,
          cost_level: m.price >= 40000 ? "고" : m.price >= 27000 ? "중" : "저",
          reasoning: `현재 조건(${use} / ${floor} / ${part})의 법적 최소 등급은 ${rule.grade} 이상입니다. ${m.name}은(는) ${m.grade} 등급으로 기준을 충족하며, ㎡당 약 ${won(m.price)} 수준입니다. ${m.tip}`,
          caution: "데모 응답입니다(실제 AI 아님). 실제 AI 분석은 API 키 입력 후 이용하세요.",
          demo: true,
        });
        setAiLoading(false);
      }, 800);
      return;
    }

    setAiLoading(true);

    const system = `너는 한국 건축 방화자재 추천 전문가다.
반드시 아래 제공된 자재 목록(JSON) 안에서만 자재를 추천하라. 목록에 없는 자재명을 절대 지어내지 마라.
[자재목록] ${JSON.stringify(MATERIALS)}
[법규규칙] ${JSON.stringify(RULES)}
[현재 건축물 조건] 용도:${use} / 층수:${floor} / 부위:${part} / 연면적:${area} / 스프링클러:${sprinkler}
이 조건의 법적 최소 등급은 "${rule.grade}"(레벨 ${rule.lvl}), 근거 ${rule.law}. 법규 미달 자재는 추천하지 마라.
반드시 아래 JSON 형식으로만 응답하라(서론·마크다운·코드펜스 금지):
{"recommended_material":"자재명","safety_grade":"등급 평가","cost_level":"단가 수준(저/중/고)","reasoning":"법규+안전+비용 근거 3~4문장","caution":"시공·사용상 주의사항 1~2문장"}`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          system,
          messages: [{ role: "user", content: question }],
        }),
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error("HTTP " + res.status + " · " + t.slice(0, 120));
      }
      const data = await res.json();
      const raw = data.content.filter((b) => b.type === "text").map((b) => b.text).join("");
      const parsed = JSON.parse(raw.replace(/```json/g, "").replace(/```/g, "").trim());
      setAiResult(parsed);
    } catch (e) {
      setAiError("AI 호출 실패: " + (e && e.message ? e.message : "알 수 없는 오류") + " — 키가 올바른지, 크레딧이 있는지, localhost로 실행 중인지 확인하세요.");
    } finally {
      setAiLoading(false);
    }
  };

  const TABS = [
    { id: "recommend", label: "① 법규매칭" },
    { id: "cost", label: "② 비용비교" },
    { id: "priority", label: "③ 우선순위" },
    { id: "ai", label: "④ AI평가" },
  ];

  const Badge = ({ grade }) => {
    const g = GRADE_META[grade];
    return (
      <span className="badge" style={{ background: g.color + "22", color: g.color, border: `1px solid ${g.color}55` }}>
        {g.icon} {grade}
      </span>
    );
  };

  return (
    <div className="ff-root">
      <style>{CSS}</style>
      <div className="tape" />

      <header className="ff-header">
        <div className="ff-logo">FIRE<b>FIT</b></div>
        <div className="ff-sub">올인원 방화자재 가이드 · 법규·비용·AI</div>
      </header>

      <nav className="ff-tabs">
        {TABS.map((t) => (
          <button key={t.id} className={`ff-tab ${tab === t.id ? "on" : ""}`} onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="ff-main">
        {/* 공통 조건 입력 (5개 조건) */}
        {tab !== "ai" && (
          <div className="card">
            <div className="card-label">／ 건축물 조건 설정</div>
            <div className="grid3">
              <div className="field"><span className="fl">용도</span>
                <select value={use} onChange={(e) => setUse(e.target.value)}>{USES.map((o) => <option key={o}>{o}</option>)}</select></div>
              <div className="field"><span className="fl">층수·높이</span>
                <select value={floor} onChange={(e) => setFloor(e.target.value)}>{FLOORS.map((o) => <option key={o}>{o}</option>)}</select></div>
              <div className="field"><span className="fl">적용 부위</span>
                <select value={part} onChange={(e) => setPart(e.target.value)}>{PARTS.map((o) => <option key={o}>{o}</option>)}</select></div>
            </div>
            <div className="cond-divider">／ 세부 조건</div>
            <div className="grid2">
              <div className="field"><span className="fl">연면적</span>
                <select value={area} onChange={(e) => setArea(e.target.value)}>{AREAS.map((o) => <option key={o}>{o}</option>)}</select></div>
              <div className="field"><span className="fl">스프링클러</span>
                <select value={sprinkler} onChange={(e) => setSprinkler(e.target.value)}>{SPRINKLERS.map((o) => <option key={o}>{o}</option>)}</select></div>
            </div>
          </div>
        )}

        {/* ① 법규 매칭 & 보고서 상시 노출 */}
        {tab === "recommend" && (
          <>
            <div className="req-box">
              <div className="card-label" style={{ color: "var(--ember)" }}>／ 최소 요구 법적 기준</div>
              <div className="req-grade">{rule.grade} 이상</div>
              <div className="req-law mono">{rule.law} · 개정 {rule.revised}</div>
              <div className="req-note">{rule.note}</div>
              {rule.extras.map((ex, i) => (
                <div className="req-note" key={i} style={{ background: "rgba(255,106,26,.08)", color: "var(--ember-soft)", marginTop: 6 }}>+ {ex}</div>
              ))}
            </div>

            <div>
              <div className="card-label">／ 기준 충족 자재 ({legalMaterials.length})</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {legalMaterials.map((m) => (
                  <div key={m.id} className="mat-row">
                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", gap: 7, alignItems: "center", flexWrap: "wrap" }}>
                        <span className="mat-name">{m.name}</span><Badge grade={m.grade} />
                      </div>
                      <div className="mat-tip">{m.tip}</div>
                    </div>
                    <div>
                      <div className="price-cap">㎡당 단가</div>
                      <div className="price-num">{won(m.price)}</div>
                    </div>
                  </div>
                ))}
                {legalMaterials.length === 0 && <div className="empty">해당 부위 적합 자재 데이터가 없습니다.</div>}
              </div>
            </div>

            {/* 보고서 텍스트 상시 노출 */}
            <div className="card">
              <div className="card-label">／ 설계 개요서·보고서용 작성 예시 (드래그하여 복사)</div>
              <div className="report-box">{reportText}</div>
              <div style={{ height: 12 }} />
              <button className="btn btn-dark" onClick={copyReport}>
                {copied === "done" ? "✓ 복사 완료!" : copied === "fail" ? "복사 실패 — 위 박스를 직접 드래그하세요" : "⎘ 한 번에 복사"}
              </button>
            </div>
          </>
        )}

        {/* ② 절대비용 비교 (₩) */}
        {tab === "cost" && (
          <div className="card">
            <div className="card-label">／ 절대 비용 비교 (㎡당 자재비+시공비)</div>
            <div className="field" style={{ marginBottom: 14 }}>
              <span className="fl">시공 면적 입력 (㎡)</span>
              <input type="number" value={areaSize} min={1}
                onChange={(e) => setAreaSize(Math.max(1, Number(e.target.value) || 0))} />
            </div>
            <div className="bar-wrap">
              {partMaterials.map((m) => {
                const legal = m.lvl >= rule.lvl;
                const col = legal ? "var(--safe)" : "var(--danger)";
                return (
                  <div key={m.id}>
                    <div className="bar-top">
                      <span style={{ fontSize: 13, fontWeight: 600 }}>
                        {m.name} {!legal && <span className="ban-label">⛔ 법적 사용 불가</span>}
                      </span>
                      <Badge grade={m.grade} />
                    </div>
                    <div className="bar-track">
                      <div className="bar-fill" style={{ width: `${(m.price / MAX_PRICE) * 100}%`, background: col }}>
                        <span>{won(m.price)}/㎡</span>
                      </div>
                    </div>
                    <div className="total-line">예상 총비용 ({areaSize.toLocaleString()}㎡): <b className="mono" style={{ color: "var(--text)" }}>{won(m.price * areaSize)}</b></div>
                  </div>
                );
              })}
            </div>
            {costDiff && (
              <div className="callout">
                법규 미달 자재({costDiff.cheapestAny.name})를 기준 충족 자재({costDiff.cheapestLegal.name})로 올리면,<br />
                {areaSize.toLocaleString()}㎡ 기준 약 <b>{won(costDiff.diff)}</b>의 추가 비용이 발생합니다.
              </div>
            )}
            <div style={{ display: "flex", gap: 16, justifyContent: "center", marginTop: 14, fontSize: 11, color: "var(--muted)" }}>
              <span className="mono">■ <span style={{ color: "var(--safe)" }}>법규 충족</span></span>
              <span className="mono">■ <span style={{ color: "var(--danger)" }}>법적 사용 불가</span></span>
            </div>
          </div>
        )}

        {/* ③ 우선순위 추천 */}
        {tab === "priority" && (
          <>
            <div className="seg">
              {[
                { id: "safety", label: "🛡 안전" },
                { id: "balance", label: "⚖ 균형" },
                { id: "cost", label: "💰 비용" },
              ].map((p) => (
                <button key={p.id} className={priority === p.id ? "on" : ""} onClick={() => setPriority(p.id)}>{p.label}</button>
              ))}
            </div>
            <div className="card">
              <div className="card-label">／ 맞춤 추천 결과</div>
              {pick ? (
                <>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span className="pick-name">{pick.name}</span>
                    <span className="badge" style={{ background: "rgba(255,106,26,.13)", color: "var(--ember)", border: "1px solid rgba(255,106,26,.4)", fontSize: 12, padding: "5px 10px" }}>
                      {won(pick.price)}/㎡
                    </span>
                  </div>
                  <div style={{ marginTop: 8 }}><Badge grade={pick.grade} /></div>
                  <div className="reason">
                    <b style={{ color: "var(--ember)" }}>추천 사유 ·</b>{" "}
                    {priority === "cost"
                      ? "법적 기준을 충족하는 가장 가성비 높은 대안입니다."
                      : priority === "safety"
                      ? "법적 기준보다 높은 등급으로, 화재 확산 방지 및 유독가스 배출이 적어 골든타임 확보에 최적입니다."
                      : "가격 대비 성능과 현장 시공성이 좋아 실무에서 가장 대중적으로 쓰이는 자재입니다."}
                  </div>
                </>
              ) : (
                <div className="empty">현재 조건에 맞는 적법 자재가 없습니다.</div>
              )}
            </div>
          </>
        )}

        {/* ④ AI 종합 평가 (클릭형 템플릿) */}
        {tab === "ai" && (
          <>
            <div className="card">
              <div className="card-label" style={{ color: "var(--ember)" }}>✦ AI 컨설팅 · 상황을 선택하세요</div>
              <div className="field" style={{ marginBottom: 12 }}>
                <span className="fl">Anthropic API 키 (선택 · 비우면 데모 모드)</span>
                <input type="password" value={apiKey} placeholder="sk-ant-..." onChange={(e) => setApiKey(e.target.value)} />
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {TEMPLATES.map((t, i) => (
                  <button key={i} className="tpl" disabled={aiLoading} onClick={() => askAI(t.text)}>
                    <span className="emo">{t.emo}</span><span>{t.text}</span>
                  </button>
                ))}
              </div>
              {aiLoading && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, justifyContent: "center", marginTop: 16, color: "var(--muted)", fontSize: 13 }}>
                  <span className="spinner" /> AI가 내장 자재 DB로 분석 중…
                </div>
              )}
            </div>

            {aiError && <div className="ai-err">{aiError}</div>}

            {aiResult && !aiLoading && (
              <div className="ai-card">
                {aiQuestion && <div className="ai-q">“{aiQuestion}”</div>}
                <div className="ai-head">
                  <div>
                    <div className="card-label" style={{ marginBottom: 5 }}>／ AI 추천 자재</div>
                    <div className="ai-mat">{aiResult.recommended_material}</div>
                  </div>
                  <div className="ai-meta">
                    안전 <b style={{ color: "var(--safe)" }}>{aiResult.safety_grade}</b><br />
                    비용 <b style={{ color: "var(--caution)" }}>{aiResult.cost_level}</b>
                  </div>
                </div>
                <div className="card-label">／ 판단 근거</div>
                <p style={{ fontSize: 13, color: "var(--text)", lineHeight: 1.6 }}>{aiResult.reasoning}</p>
                {aiResult.caution && (
                  <div className="ai-caution"><span>▲</span><span>{aiResult.caution}</span></div>
                )}
                <div className="ai-flag mono">{aiResult.demo ? "데모 모드 · 내장 DB 기반 (실제 AI 아님)" : "내장 DB 기반 · 유령 자재 차단 · AI 참고 의견"}</div>
              </div>
            )}
          </>
        )}
      </main>

      <footer className="foot">
        ⚠ 본 정보는 참고용입니다. 최종 시공·자재 선정 시 반드시<br />
        관계 법령 확인 및 소방·건축 전문가의 검토를 거치세요.
      </footer>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FireFitApp />);
</script>
</body>
</html>
