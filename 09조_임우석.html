<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Archilingo v11.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
 *{font-family:'Orbitron',sans-serif;-webkit-tap-highlight-color:transparent;box-sizing:border-box}
 body{background:#05010f;color:#e9e9ff;overflow-x:hidden}
 .aurora{position:fixed;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:drift 14s ease-in-out infinite alternate}
 @keyframes drift{to{transform:translate(40px,-40px) scale(1.2)}}
 .neon{box-shadow:0 0 12px currentColor,0 0 26px currentColor}
 .glass{background:rgba(20,12,45,.55);backdrop-filter:blur(14px);border:1px solid rgba(140,90,255,.25)}
 .drop{border:2px dashed rgba(150,100,255,.5);transition:.25s}
 .drop.hot{border-color:#22d3ee;background:rgba(34,211,238,.08);box-shadow:0 0 30px rgba(34,211,238,.3)}
 .btn{transition:.16s;cursor:pointer}.btn:active{transform:scale(.94)}
 @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
 .pop{animation:pop .4s ease both}
 .spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
 @keyframes burst{0%{transform:scale(.3) rotate(-20deg);filter:brightness(2)}55%{transform:scale(1.4) rotate(8deg)}100%{transform:scale(1) rotate(0);filter:brightness(1)}}
 .burst{animation:burst .55s ease both}
 @keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
 .float-particle{position:fixed;font-weight:900;pointer-events:none;z-index:99;animation:floatUp 1s ease forwards}
 .node{transition:.2s}.node:hover{transform:translateY(-3px)}
 ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#7c3aed;border-radius:3px}
 .tab{opacity:.45;transition:.2s}.tab.on{opacity:1;color:#67e8f9}
 .hidden{display:none}
 input[type=range]{-webkit-appearance:none;height:6px;border-radius:3px;background:#3b2a6b;outline:none}
 input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee;cursor:pointer}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pulse{animation:pulse 1.6s infinite}
 @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
 .shake{animation:shake .4s ease}
 #colorBurst{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;transition:opacity .12s}
 #colorBurst.on{opacity:.4;animation:cbFade .5s ease forwards}
 @keyframes cbFade{0%{opacity:.5}100%{opacity:0}}
 .pathLine{position:absolute;width:3px;background:linear-gradient(#7c3aed,#22d3ee);left:50%;z-index:0;opacity:.4}
 .locked{filter:grayscale(1) brightness(.5);opacity:.7}
</style>
</head>
<body class="min-h-screen pb-24">
<div class="aurora" style="width:340px;height:340px;background:#7c3aed;top:-60px;left:-40px"></div>
<div class="aurora" style="width:300px;height:300px;background:#06b6d4;bottom:40px;right:-60px;animation-delay:-5s"></div>
<div id="colorBurst"></div>

<div class="relative z-10 max-w-md mx-auto px-4 pt-5">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-lg font-black neon" style="color:#67e8f9">ARCHILINGO</h1>
    <div class="flex items-center gap-2 text-xs">
      <span id="heartUI" class="glass px-2 py-1 rounded btn" onclick="openShop()">❤️ 5</span>
      <span id="xpUI" class="glass px-2 py-1 rounded">⚡ 0</span>
      <span id="gemUI" class="glass px-2 py-1 rounded btn" onclick="openShop()">💎 0</span>
    </div>
  </div>

  <div id="resumeBanner" class="glass rounded-2xl p-4 mb-4 hidden btn pulse" style="border-color:#fbbf24" onclick="resumeSession()">
    <div class="flex items-center gap-3">
      <div class="text-2xl">⏸️</div>
      <div class="flex-1"><div class="text-sm font-bold text-yellow-300">이어하기</div><div class="text-[10px] text-yellow-200/70" id="resumeInfo"></div></div>
      <div class="text-yellow-300">▶</div>
    </div>
  </div>

  <section id="tab-map" class="space-y-3"></section>

  <section id="tab-upload" class="space-y-4 hidden">
    <h2 class="text-lg font-bold text-purple-300">📄 AI 문제 생성기</h2>
    <p class="text-[11px] text-purple-200/70">PDF/텍스트 넣으면 4패턴 문제 자동생성. (키 없으면 로컬 데모)</p>
    <div id="drop" class="drop glass rounded-2xl p-7 text-center btn">
      <div class="text-4xl mb-2">📥</div><div class="text-sm font-bold">PDF 드래그 또는 클릭</div>
      <input id="fileInput" type="file" accept="application/pdf" class="hidden">
    </div>
    <div>
      <label class="text-[11px] text-purple-300">✍️ 텍스트 붙여넣기</label>
      <textarea id="rawText" rows="4" placeholder="강의 자료 텍스트..." class="w-full mt-1 p-3 rounded-xl glass text-xs text-white outline-none focus:ring-2 ring-cyan-400/50"></textarea>
      <div class="text-right text-[10px] text-purple-300/50"><span id="charCount">0</span> 자</div>
    </div>
    <div class="glass rounded-xl p-3 space-y-3">
      <div>
        <div class="flex justify-between text-[11px] text-cyan-300"><span>📊 문제 수</span><span id="cntVal">4</span>개</div>
        <input id="cntSlider" type="range" min="3" max="10" value="4" class="w-full mt-1">
      </div>
      <div>
        <div class="flex justify-between text-[11px] text-purple-300"><span>🔥 난이도</span><span id="diffVal">보통</span></div>
        <input id="diffSlider" type="range" min="0" max="2" value="1" class="w-full mt-1">
      </div>
    </div>
    <div class="glass rounded-xl p-3">
      <label class="text-[11px] text-cyan-300">🔑 OpenAI API Key <span class="text-[9px] text-purple-300/50">(선택·로컬저장)</span></label>
      <input id="apiKey" type="password" placeholder="sk-... (없으면 로컬 데모)" class="w-full mt-1 p-2 rounded-lg bg-black/40 text-xs text-white outline-none focus:ring-2 ring-purple-400/50">
      <p class="text-[9px] text-red-300/70 mt-1">⚠️ 개인 테스트용. 실배포 시 백엔드 프록시 필수.</p>
    </div>
    <button id="genBtn" class="btn w-full py-3 rounded-xl font-black neon" style="background:linear-gradient(90deg,#22d3ee,#a855f7);color:#0a0a1a">⚡ 문제 생성</button>
    <div id="status" class="text-center text-xs text-cyan-300 hidden"></div>
    <div id="genResult" class="space-y-2"></div>
  </section>

  <section id="tab-deck" class="space-y-3 hidden">
    <h2 class="text-lg font-bold text-purple-300">📚 내 업로드 문제 <span class="text-[10px] text-green-300">(하트 무소모 ♾️)</span></h2>
    <div id="deckList" class="space-y-2"></div>
  </section>

  <section id="tab-profile" class="space-y-3 hidden">
    <h2 class="text-lg font-bold text-purple-300">👤 프로필</h2>
    <div class="glass rounded-2xl p-5 text-center">
      <div class="text-5xl mb-2">🏗️</div><div class="text-sm font-bold">건축시공 수련생</div>
      <div class="grid grid-cols-3 gap-2 mt-4 text-center">
        <div class="glass rounded-xl py-3"><div class="text-xl font-black text-cyan-300" id="pLvl">1</div><div class="text-[9px]">LEVEL</div></div>
        <div class="glass rounded-xl py-3"><div class="text-xl font-black text-purple-300" id="pXp">0</div><div class="text-[9px]">XP</div></div>
        <div class="glass rounded-xl py-3"><div class="text-xl font-black text-pink-300" id="pGem">0</div><div class="text-[9px]">GEM</div></div>
      </div>
    </div>
    <button onclick="openShop()" class="btn w-full py-2 rounded-xl text-xs glass text-cyan-300">🛒 젬 상점 열기</button>
    <button onclick="if(confirm('진짜 초기화?')){localStorage.clear();location.reload()}" class="btn w-full py-2 rounded-xl text-xs glass text-red-300">🗑️ 데이터 초기화</button>
  </section>
</div>

<div id="shopModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden p-4 overflow-y-auto" onclick="if(event.target===this)closeShop()">
  <div class="max-w-md mx-auto pt-10">
    <div class="glass rounded-2xl p-5 pop">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-black text-cyan-300">🛒 젬 상점</h2>
        <button onclick="closeShop()" class="text-xl btn">✕</button>
      </div>
      <div class="text-center text-sm mb-4">보유 💎 <span id="shopGem" class="font-black text-pink-300">0</span></div>
      <div class="space-y-3">
        <button class="btn glass w-full p-4 rounded-xl flex items-center gap-3 text-left" onclick="buyHearts()">
          <div class="text-3xl">❤️</div>
          <div class="flex-1"><div class="font-bold text-sm">하트 풀충전</div><div class="text-[10px] text-purple-200/70">❤️ 5개로 채움</div></div>
          <div class="text-pink-300 font-black text-sm">💎30</div>
        </button>
        <button class="btn glass w-full p-4 rounded-xl flex items-center gap-3 text-left" onclick="buyCombo()">
          <div class="text-3xl">🛡️</div>
          <div class="flex-1"><div class="font-bold text-sm">콤보 보호 <span id="comboGuardCnt" class="text-[10px] text-yellow-300"></span></div><div class="text-[10px] text-purple-200/70">다음 오답 1회 콤보 유지</div></div>
          <div class="text-pink-300 font-black text-sm">💎50</div>
        </button>
        <button class="btn glass w-full p-4 rounded-xl flex items-center gap-3 text-left" onclick="buySkip()">
          <div class="text-3xl">⏭️</div>
          <div class="flex-1"><div class="font-bold text-sm">스킵권 <span id="skipCnt" class="text-[10px] text-yellow-300"></span></div><div class="text-[10px] text-purple-200/70">어려운 문제 패스 (퀴즈 중 사용)</div></div>
          <div class="text-pink-300 font-black text-sm">💎20</div>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="quizModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden p-4 overflow-y-auto">
  <div class="max-w-md mx-auto pt-6">
    <div class="flex justify-between items-center mb-3">
      <button onclick="closeQuiz(true)" class="text-xl btn">✕</button>
      <div class="flex-1 mx-3 h-2 rounded-full bg-purple-900/50 overflow-hidden"><div id="qProg" class="h-full" style="background:linear-gradient(90deg,#22d3ee,#a855f7);width:0%"></div></div>
      <span id="comboUI" class="text-xs font-black text-yellow-300"></span>
    </div>
    <div id="qBody"></div>
  </div>
</div>

<nav class="fixed bottom-0 left-0 right-0 z-40 glass border-t border-purple-500/30">
  <div class="max-w-md mx-auto flex justify-around py-2 text-center text-[10px]">
    <button class="tab on btn flex flex-col items-center gap-1" data-tab="map"><span class="text-xl">🗺️</span>MAP</button>
    <button class="tab btn flex flex-col items-center gap-1" data-tab="upload"><span class="text-xl">📄</span>UPLOAD</button>
    <button class="tab btn flex flex-col items-center gap-1" data-tab="deck"><span class="text-xl">📚</span>DECK</button>
    <button class="tab btn flex flex-col items-center gap-1" data-tab="profile"><span class="text-xl">👤</span>ME</button>
  </div>
</nav>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);

let G=JSON.parse(localStorage.getItem('archi_g')||'null')||{xp:0,gem:0,lvl:1,hearts:5,lastHeart:Date.now(),stars:{},comboGuard:0,skips:0};
if(G.comboGuard===undefined)G.comboGuard=0;
if(G.skips===undefined)G.skips=0;
function saveG(){localStorage.setItem('archi_g',JSON.stringify(G));renderTop()}
function renderTop(){
  $('heartUI').textContent='❤️ '+G.hearts;$('xpUI').textContent='⚡ '+G.xp;$('gemUI').textContent='💎 '+G.gem;
  $('pLvl').textContent=G.lvl;$('pXp').textContent=G.xp;$('pGem').textContent=G.gem;
}
setInterval(()=>{if(G.hearts<5){const el=Date.now()-G.lastHeart;if(el>=45000){G.hearts++;G.lastHeart=Date.now();saveG()}}},1000);

/* ===== v11.1: SHUFFLE PATCH ===== */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function shuffleChoices(q){
  if((q.type==='mc'||q.type==='blank')&&Array.isArray(q.choices)){
    const correct=q.choices[q.answer];
    q.choices=shuffle(q.choices);
    q.answer=q.choices.indexOf(correct);
  }
  return q;
}
// 문제 순서 + 보기 둘 다 섞기 (원본 보호: 깊은 복사)
function shuffleAll(questions){
  return shuffle(questions).map(q=>shuffleChoices({...q,choices:Array.isArray(q.choices)?[...q.choices]:q.choices}));
}

function openShop(){$('shopModal').classList.remove('hidden');$('shopGem').textContent=G.gem;$('comboGuardCnt').textContent=G.comboGuard>0?'(보유 '+G.comboGuard+')':'';$('skipCnt').textContent=G.skips>0?'(보유 '+G.skips+')':'';}
function closeShop(){$('shopModal').classList.add('hidden');}
function buyHearts(){
  if(G.hearts>=5){alert('하트 이미 풀임 ❤️5');return}
  if(G.gem<30){alert('젬 부족! ('+G.gem+'/30)');return}
  G.gem-=30;G.hearts=5;G.lastHeart=Date.now();saveG();openShop();burstParticle('❤️ FULL','#f472b6');
}
function buyCombo(){
  if(G.gem<50){alert('젬 부족! ('+G.gem+'/50)');return}
  G.gem-=50;G.comboGuard++;saveG();openShop();burstParticle('🛡️ +1','#fbbf24');
}
function buySkip(){
  if(G.gem<20){alert('젬 부족! ('+G.gem+'/20)');return}
  G.gem-=20;G.skips++;saveG();openShop();burstParticle('⏭️ +1','#67e8f9');
}

const STAGES=[
 {id:'s1',title:'구조공법',icon:'🏛️',color:'#22d3ee',questions:[
   {type:'mc',q:'PC공법에서 PC가 의미하는 것은?',choices:['Precast Concrete','Post Concrete','Pre Cast','Pour Concrete'],answer:0,explain:'Precast=공장 사전제작'},
   {type:'ox',q:'철골구조는 RC구조보다 일반적으로 경량이다.',answer:true,explain:'강재가 단면 대비 강도가 높아 경량'},
   {type:'chosung',q:'공장에서 미리 만들어 현장 조립하는 구법은? (ㅍㅅ ㄱㅂ)',answer:'PC구법',explain:'Precast 구법'}
 ]},
 {id:'s2',title:'방수공사',icon:'💧',color:'#a855f7',questions:[
   {type:'blank',q:'아스팔트 방수는 여러 겹의 _____ 를 적층하는 멤브레인 방수다.',choices:['루핑','단열재','거푸집','와이어메시'],answer:0,explain:'아스팔트 루핑 적층'},
   {type:'ox',q:'시트방수는 이음부 처리가 가장 중요한 시공 포인트다.',answer:true,explain:'이음부 누수 취약'},
   {type:'mc',q:'지하실 외벽에 적합한 방수는?',choices:['외방수','내방수','도막방수','시멘트방수'],answer:0,explain:'수압 대응 외방수 유리'}
 ]},
 {id:'s3',title:'재료',icon:'🧱',color:'#f472b6',questions:[
   {type:'mc',q:'콘크리트 압축강도 시험 표준 양생기간은?',choices:['28일','7일','14일','60일'],answer:0,explain:'28일 강도 기준'},
   {type:'chosung',q:'콘크리트 보강용 강재는? (ㅊㄱ)',answer:'철근',explain:'인장력 보강'},
   {type:'ox',q:'물시멘트비(W/C)가 높을수록 강도는 증가한다.',answer:false,explain:'W/C 높으면 강도 저하'}
 ]}
];

function normalize(s){return (s||'').replace(/\s/g,'').toLowerCase()}
function comboMult(st){if(st>=5)return 2.0;if(st===4)return 1.8;if(st===3)return 1.5;if(st===2)return 1.2;return 1.0}
function allStages(){return STAGES.concat(JSON.parse(localStorage.getItem('archi_deck')||'[]'))}

function isUnlocked(i){
  if(i===0)return true;
  const prev=STAGES[i-1];
  return (G.stars[prev.id]||0)>0;
}

function renderMap(){
  const c=$('tab-map');
  c.innerHTML='<h2 class="text-lg font-bold text-purple-300 mb-1">🗺️ 학습 맵</h2><div class="text-[10px] text-purple-200/60 mb-3">⭐ 1개 이상 받으면 다음 스테이지 해제</div>';
  const wrap=document.createElement('div');wrap.className='relative';wrap.style.minHeight=(STAGES.length*110)+'px';
  STAGES.forEach((s,i)=>{
    const stars=G.stars[s.id]||0;const unlocked=isUnlocked(i);
    if(i>0){const line=document.createElement('div');line.className='pathLine';line.style.top=(i*110-40)+'px';line.style.height='60px';wrap.appendChild(line);}
    const node=document.createElement('div');
    node.className='node glass rounded-2xl p-4 absolute btn flex items-center gap-3'+(unlocked?'':' locked');
    node.style.width='70%';node.style.top=(i*110)+'px';
    node.style[i%2===0?'left':'right']='0';
    if(unlocked){node.onclick=()=>startQuiz(s,false);}else{node.onclick=()=>{burstParticle('🔒 잠김','#a855f7');};}
    const icon=unlocked?s.icon:'🔒';
    node.innerHTML='<div class="text-3xl" style="filter:drop-shadow(0 0 8px '+s.color+')">'+icon+'</div><div class="flex-1"><div class="font-bold text-sm">'+s.title+'</div><div class="text-[10px] text-yellow-300">'+(unlocked?('⭐'.repeat(stars)+'☆'.repeat(3-stars)):'<span class="text-purple-300/60">잠김</span>')+'</div></div>'+(unlocked?'<div class="text-xs text-cyan-300">▶</div>':'');
    wrap.appendChild(node);
  });
  c.appendChild(wrap);
}

let Q=null;
function persistSession(){if(Q)localStorage.setItem('archi_session',JSON.stringify(Q));}
function clearSession(){localStorage.removeItem('archi_session');}

function startQuiz(stage,isDeck){
  if(!isDeck && G.hearts<=0){
    if(confirm('하트 없음! 💎30으로 충전할까?')){openShop();}
    return;
  }
  // ★ v11.1: 문제 순서 + 보기 셔플 (원본 STAGES/deck 안 망가짐)
  Q={stageId:stage.id,stageTitle:stage.title,questions:shuffleAll(stage.questions),idx:0,streak:0,correct:0,wrong:[],useHeart:!isDeck};
  persistSession();$('quizModal').classList.remove('hidden');showQ();
}
function closeQuiz(abort){
  $('quizModal').classList.add('hidden');
  if(abort)clearSession();
  renderMap();renderDeck();checkResume();
}

function showQ(){
  const q=Q.questions[Q.idx];
  $('qProg').style.width=(Q.idx/Q.questions.length*100)+'%';
  $('comboUI').textContent=Q.streak>=2?('🔥x'+comboMult(Q.streak)):'';
  let inner='<div class="glass rounded-2xl p-5 mb-4 pop"><div class="text-[10px] text-cyan-300 mb-2">'+q.type.toUpperCase()+' · '+(Q.idx+1)+'/'+Q.questions.length+(Q.useHeart?'':' · ♾️')+'</div><div class="text-base font-bold leading-relaxed">'+q.q+'</div></div>';
  if(q.type==='ox'){
    inner+='<div class="grid grid-cols-2 gap-3"><button class="btn glass rounded-2xl py-8 text-3xl font-black text-green-300 neon" onclick="grade(true)">⭕</button><button class="btn glass rounded-2xl py-8 text-3xl font-black text-red-300 neon" onclick="grade(false)">❌</button></div>';
  }else if(q.type==='chosung'){
    inner+='<input id="chInput" class="w-full p-4 rounded-2xl glass text-center text-lg text-white outline-none focus:ring-2 ring-cyan-400" placeholder="정답 입력" onkeydown="if(event.key===\'Enter\')grade(document.getElementById(\'chInput\').value)"><button class="btn w-full mt-3 py-3 rounded-2xl font-black neon" style="background:linear-gradient(90deg,#22d3ee,#a855f7);color:#0a0a1a" onclick="grade(document.getElementById(\'chInput\').value)">제출</button>';
  }else{
    inner+='<div class="space-y-2">'+q.choices.map((c,i)=>'<button class="btn glass w-full text-left px-4 py-3 rounded-xl text-sm" onclick="grade('+i+')">'+String.fromCharCode(65+i)+'. '+c+'</button>').join('')+'</div>';
  }
  if(G.skips>0){
    inner+='<button class="btn w-full mt-3 py-2 rounded-xl text-xs glass text-cyan-300" onclick="useSkip()">⏭️ 스킵권 사용 (보유 '+G.skips+')</button>';
  }
  $('qBody').innerHTML=inner;
}

function useSkip(){
  if(G.skips<=0)return;
  G.skips--;saveG();
  burstParticle('⏭️ SKIP','#67e8f9');
  Q.idx++;persistSession();
  if(Q.idx>=Q.questions.length){finishQuiz();return}
  showQ();
}

function grade(ans){
  const q=Q.questions[Q.idx];let ok=false;
  if(q.type==='ox')ok=(ans===q.answer);
  else if(q.type==='chosung')ok=(normalize(ans)===normalize(q.answer));
  else ok=(ans===q.answer);
  if(ok){
    Q.streak++;Q.correct++;const m=comboMult(Q.streak);
    const xp=Math.round(10*m),gem=Math.round(2*m);G.xp+=xp;G.gem+=gem;if(G.xp>=G.lvl*100)G.lvl++;
    burstParticle('+'+xp+'XP','#67e8f9');
    if(m>=1.5){triggerShake();triggerBurst(m>=2.0?'#f472b6':'#fbbf24');}
  }else{
    if(G.comboGuard>0){
      G.comboGuard--;burstParticle('🛡️ 콤보 보호!','#fbbf24');
    }else{
      Q.streak=0;
      if(Q.useHeart)G.hearts=Math.max(0,G.hearts-1);
      burstParticle(Q.useHeart?'-❤️':'❌','#f87171');
    }
    Q.wrong.push(Q.idx);
  }
  saveG();persistSession();showFeedback(ok,q.explain);
}

function triggerShake(){const m=document.querySelector('#quizModal>div');if(m){m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');}}
function triggerBurst(color){const cb=$('colorBurst');cb.style.background='radial-gradient(circle,'+color+',transparent 70%)';cb.classList.remove('on');void cb.offsetWidth;cb.classList.add('on');}

function showFeedback(ok,explain){
  const fb=document.createElement('div');fb.className='glass rounded-2xl p-4 mt-3 pop';
  fb.innerHTML='<div class="font-black '+(ok?'text-green-300':'text-red-300')+'">'+(ok?'✅ 정답!':'❌ 오답')+'</div><div class="text-xs text-purple-200/80 mt-1">💡 '+(explain||'')+'</div><button class="btn w-full mt-3 py-2 rounded-xl font-bold neon" style="background:linear-gradient(90deg,#a855f7,#22d3ee);color:#0a0a1a" onclick="nextQ()">다음 ▶</button>';
  $('qBody').appendChild(fb);
}

function nextQ(){
  Q.idx++;persistSession();
  if(Q.idx>=Q.questions.length){finishQuiz();return}
  if(Q.useHeart && G.hearts<=0){alert('하트 소진! 다음에 다시');closeQuiz(false);return}
  showQ();
}

function finishQuiz(){
  const total=Q.questions.length;
  const stars=Q.correct===total?3:Q.correct>=total*0.6?2:1;
  if(Q.stageId!=='review'&&(G.stars[Q.stageId]||0)<stars){G.stars[Q.stageId]=stars;saveDeckStars(Q.stageId,stars);}
  saveG();clearSession();
  $('qBody').innerHTML='<div class="glass rounded-2xl p-6 text-center burst"><div class="text-5xl mb-2">'+(stars===3?'🏆':'🎉')+'</div><div class="text-xl font-black text-cyan-300">'+'⭐'.repeat(stars)+'</div><div class="text-sm mt-2">'+Q.correct+'/'+total+' 정답</div>'+(Q.wrong.length?'<button class="btn w-full mt-4 py-2 rounded-xl text-xs glass text-yellow-300" onclick="reviewWrong()">📝 오답만 다시 ('+Q.wrong.length+')</button>':'')+'<button class="btn w-full mt-2 py-3 rounded-xl font-black neon" style="background:linear-gradient(90deg,#22d3ee,#a855f7);color:#0a0a1a" onclick="closeQuiz(true)">완료</button></div>';
  $('qProg').style.width='100%';
  if(stars===3){triggerBurst('#f472b6');}
}
function saveDeckStars(id,stars){
  const d=JSON.parse(localStorage.getItem('archi_deck')||'[]');
  const t=d.find(x=>x.id===id);if(t){t.stars=stars;localStorage.setItem('archi_deck',JSON.stringify(d));}
}

function reviewWrong(){
  const wq=Q.wrong.map(i=>Q.questions[i]);const uh=Q.useHeart;
  // ★ v11.1: 오답복습도 셔플
  Q={stageId:'review',stageTitle:'오답복습',questions:shuffleAll(wq),idx:0,streak:0,correct:0,wrong:[],useHeart:uh};showQ();
}

function burstParticle(txt,color){
  const p=document.createElement('div');p.className='float-particle';p.textContent=txt;
  p.style.color=color;p.style.left='50%';p.style.top='40%';p.style.fontSize='20px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
}

function checkResume(){
  const s=JSON.parse(localStorage.getItem('archi_session')||'null');
  if(s&&s.stageId!=='review'&&s.idx<s.questions.length){
    $('resumeBanner').classList.remove('hidden');
    $('resumeInfo').textContent=s.stageTitle+' · '+(s.idx+1)+'/'+s.questions.length+'문제';
  }else $('resumeBanner').classList.add('hidden');
}
function resumeSession(){
  const s=JSON.parse(localStorage.getItem('archi_session')||'null');if(!s)return;
  if(s.useHeart===undefined)s.useHeart=true;
  Q=s;$('resumeBanner').classList.add('hidden');$('quizModal').classList.remove('hidden');showQ();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    ['map','upload','deck','profile'].forEach(n=>$('tab-'+n).classList.add('hidden'));
    $('tab-'+t.dataset.tab).classList.remove('hidden');
    if(t.dataset.tab==='deck')renderDeck();
  };
});

const drop=$('drop'),fileInput=$('fileInput'),rawText=$('rawText'),apiKey=$('apiKey'),genBtn=$('genBtn'),status=$('status'),genResult=$('genResult'),charCount=$('charCount'),cntSlider=$('cntSlider'),diffSlider=$('diffSlider');
const DIFFS=['쉬움','보통','어려움'];
apiKey.value=localStorage.getItem('archi_apikey')||'';
apiKey.addEventListener('input',()=>localStorage.setItem('archi_apikey',apiKey.value));
rawText.addEventListener('input',()=>charCount.textContent=rawText.value.length);
cntSlider.addEventListener('input',()=>$('cntVal').textContent=cntSlider.value);
diffSlider.addEventListener('input',()=>$('diffVal').textContent=DIFFS[diffSlider.value]);
drop.onclick=()=>fileInput.click();
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(f)readPDF(f)});
fileInput.onchange=e=>{const f=e.target.files[0];if(f)readPDF(f)};
function setStatus(m,s){status.classList.remove('hidden');status.innerHTML=(s?'<span class="inline-block spin">⏳</span> ':'')+m}

async function readPDF(file){
  setStatus('📖 PDF 읽는 중...',true);
  try{
    const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let t='';for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}
    rawText.value=t.trim();charCount.textContent=rawText.value.length;setStatus('✅ '+pdf.numPages+'페이지 추출 완료',false);
  }catch(e){setStatus('❌ '+e.message,false)}
}

async function callAI(text,key,count,diff){
  const res=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:'gpt-4o-mini',response_format:{type:'json_object'},messages:[
      {role:'system',content:'너는 건축시공 교육 문제 출제기다. 주어진 텍스트로 난이도 "'+diff+'" 수준의 문제 '+count+'개를 만들어 JSON으로만 답해라. 유형은 mc(4지선다),ox(참거짓),blank(빈칸 4지선다),chosung(초성 텍스트입력) 골고루 섞어라. 형식: {"questions":[{"type":"mc","q":"질문","choices":["a","b","c","d"],"answer":0,"explain":"해설"},{"type":"ox","q":"질문","answer":true,"explain":"해설"},{"type":"chosung","q":"질문 (ㅊㅅ힌트)","answer":"정답","explain":"해설"}]}'},
      {role:'user',content:text.slice(0,4000)}]})
  });
  if(!res.ok)throw new Error('API '+res.status);
  const d=await res.json();return JSON.parse(d.choices[0].message.content).questions;
}

function localGenerate(text,count){
  let sents=text.replace(/\n/g,' ').split(/(?<=[.。!?])\s+/).filter(s=>s.length>12&&s.length<140);
  const docWords=[...new Set(text.replace(/[^가-힣A-Za-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=2&&w.length<=8))];
  const fallbackPool=['콘크리트','방수층','거푸집','철근','단열재','루핑'];
  function pickDistractors(ans,n){
    const cand=docWords.filter(w=>w!==ans);
    const shuffled=cand.sort(()=>Math.random()-.5);
    let res=shuffled.slice(0,n);
    for(let k=0;res.length<n&&k<fallbackPool.length;k++){if(fallbackPool[k]!==ans&&!res.includes(fallbackPool[k]))res.push(fallbackPool[k]);}
    return res;
  }
  const qs=[];
  for(let i=0;i<sents.length&&qs.length<count;i++){
    const s=sents[i];const words=s.split(' ').filter(w=>w.length>=2);if(!words.length)continue;
    const ans=words[Math.floor(Math.random()*words.length)];const type=['blank','ox','chosung','mc'][qs.length%4];
    if(type==='ox'){
      if(Math.random()<0.5){
        const other=pickDistractors(ans,1)[0];
        if(other){
          qs.push({type:'ox',q:s.replace(ans,other),answer:false,explain:'원문은 "'+ans+'"인데 "'+other+'"로 바뀜 → 거짓'});
        }else{
          qs.push({type:'ox',q:s,answer:true,explain:'원문 그대로(참)'});
        }
      }else{
        qs.push({type:'ox',q:s,answer:true,explain:'원문 그대로(참)'});
      }
    }
    else if(type==='chosung'){
      const ch=[...ans].map(c=>{const code=c.charCodeAt(0)-44032;if(code<0||code>11171)return c;return ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'][Math.floor(code/588)]}).join('');
      qs.push({type:'chosung',q:s.replace(ans,'_____')+' ('+ch+')',answer:ans,explain:'원문 기반'});
    }
    else{
      const fakes=pickDistractors(ans,3);const ch=[ans,...fakes].sort(()=>Math.random()-.5);
      qs.push({type:type==='blank'?'blank':'mc',q:s.replace(ans,'_____'),choices:ch,answer:ch.indexOf(ans),explain:'원문 기반'});
    }
  }
  return qs.length?qs:[{type:'mc',q:'텍스트가 너무 짧아요',choices:['더 긴','자료를','넣어','주세요'],answer:0,explain:'데모'}];
}

genBtn.onclick=async()=>{
  const text=rawText.value.trim();if(!text){setStatus('❌ 텍스트/PDF 먼저',false);return}
  genResult.innerHTML='';const key=apiKey.value.trim();const count=+cntSlider.value;const diff=DIFFS[diffSlider.value];let qs;
  try{
    if(key){setStatus('🤖 AI 출제 중... ('+count+'문제·'+diff+')',true);qs=await callAI(text,key,count,diff)}
    else{setStatus('🧪 로컬 데모 출제...',true);await new Promise(r=>setTimeout(r,600));qs=localGenerate(text,count)}
    setStatus('✅ '+qs.length+'문제 생성!',false);showGen(qs,diff);
  }catch(e){setStatus('❌ '+e.message+' → 로컬 폴백',false);showGen(localGenerate(text,count),diff)}
};

function showGen(qs,diff){
  qs.forEach((q,i)=>{
    const card=document.createElement('div');card.className='glass rounded-xl p-3 pop';card.style.animationDelay=(i*.08)+'s';
    let ansTxt=q.type==='ox'?(q.answer?'⭕ 참':'❌ 거짓'):q.type==='chosung'?q.answer:(q.choices?q.choices[q.answer]:'');
    card.innerHTML='<div class="text-[9px] text-cyan-300 mb-1">'+q.type.toUpperCase()+' · Q'+(i+1)+'</div><div class="text-xs font-bold mb-1">'+q.q+'</div><div class="text-[10px] text-green-300">정답: '+ansTxt+'</div>';
    genResult.appendChild(card);
  });
  const deck=JSON.parse(localStorage.getItem('archi_deck')||'[]');
  deck.push({id:'deck_'+Date.now(),title:'업로드 '+(deck.length+1)+' ('+diff+')',icon:'📦',color:'#a855f7',stars:0,questions:qs});
  localStorage.setItem('archi_deck',JSON.stringify(deck));
  const b=document.createElement('div');b.className='glass rounded-xl p-3 text-center text-xs text-cyan-300 mt-2';b.textContent='✅ DECK 탭에 추가됨 — 거기서 플레이! (하트 무소모)';genResult.appendChild(b);
}

function renderDeck(){
  const deck=JSON.parse(localStorage.getItem('archi_deck')||'[]');const c=$('deckList');
  if(!deck.length){c.innerHTML='<div class="glass rounded-2xl p-6 text-center text-xs text-purple-300/60">아직 없음.<br>UPLOAD 탭에서 문제를 만들어봐 📄</div>';return}
  c.innerHTML='';
  deck.forEach((s,i)=>{
    const stars=s.stars||0;
    const node=document.createElement('div');node.className='node glass rounded-2xl p-4 btn flex items-center gap-3';node.onclick=()=>startQuiz(s,true);
    node.innerHTML='<div class="text-3xl">'+s.icon+'</div><div class="flex-1"><div class="font-bold text-sm">'+s.title+'</div><div class="text-[10px] text-yellow-300">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+' · '+s.questions.length+'문제</div></div><button onclick="event.stopPropagation();delDeck('+i+')" class="text-red-300 text-xs">🗑️</button><div class="text-cyan-300">▶</div>';
    c.appendChild(node);
  });
}
function delDeck(i){const d=JSON.parse(localStorage.getItem('archi_deck')||'[]');d.splice(i,1);localStorage.setItem('archi_deck',JSON.stringify(d));renderDeck()}

renderTop();renderMap();checkResume();
</script>
